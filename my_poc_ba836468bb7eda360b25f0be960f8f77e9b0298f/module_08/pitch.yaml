need: "Fico struggles to find photography jobs that match his skills and interests because opportunities are scattered across different platforms. "
product: "Connects employers who need specific jobs completed with freelancers who choose quests that match their skills and interests, while building profiles that showcase their completed work."
category: "A skill-matched freelance job board with an adventurer’s quest theme."
benefit: "Aims to reduce Fico’s job-search time from 8 hours to 2 hours per week while building a profile that showcases his completed work."
alternative: "Searching social media, general job boards, and separate freelance platforms."
difference: "A regular job board shows Fico the same listings unless he changes the filters himself. Campfire’s AI ranks open photography quests using his skills, completed work, and ratings of past matches. If Fico consistently rates event photography higher than product shoots, the AI moves similar event quests higher in his recommendations. Fico reviews the scope and deadline and decides which quest to accept."
market: "Freelance photographers seeking paid projects and employers who need photography services."
