name: "Fico"
role: "Freelance photographer"
photo: "https://randomuser.me/api/portraits/men/32.jpg"
goal: "\tCut my gig search from 8 hours to 2 hours a week and build a profile that shows my completed shoots."
frustrations: "He spends 8 hours a week checking job boards, Facebook groups, and Instagram for gigs. By the time he finds a birthday shoot that fits his style and schedule, the client has already booked someone else."
quote: "I don't like jumping between sites looking for shoots. I want to pick something I’m excited about and get back behind the camera."
says: "Where can I find available photography jobs?"
thinks: "Would I enjoy this shoot? Does it give me a chance to do the kind of photography I love?"
does: "Browses job listings, shares his portfolio, and contacts clients about projects that catch his interest."
feels: "Excited when he finds creative work he can choose for himself, but discouraged when opportunities are hard to find."
